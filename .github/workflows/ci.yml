# SPDX-License-Identifier: MPL-2.0
# CHOPPAH on main: build and test every merge. A merge does not release any more: a release is a tag
# (vX.Y), built and attested by .github/workflows/release.yml, so the Firmware Hub can show it as built from source.
#
# This workflow is the check on every push to main: the engine's tests (plain cc, no toolchain), the firmware build
# itself (the JieLi toolchain and the AC79 SDK), and the browser emulator's build.
name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write                        # the beta on choppah.app: this run's GitHub OIDC token (below)

concurrency:
  group: ci
  cancel-in-progress: true

env:
  EMSDK_VERSION: 3.1.74

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pillow with raqm (the build's fonts)
        run: |
          raqm() { /usr/bin/python3 -c 'from PIL import features; raise SystemExit(not features.check("raqm"))' 2>/dev/null; }
          raqm || /usr/bin/python3 -m pip install -q --user --break-system-packages Pillow
          raqm || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }
          raqm && /usr/bin/python3 -c 'import PIL; print("Pillow", PIL.__version__, "with raqm")'

      # JieLi's toolchain (pkgman.jieliapp.com) and the SDK files (gitee) are pinned in bootstrap.sh: cached until
      # bootstrap.sh changes, which also spares the build those two slow, now-and-then flaky servers
      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: fm1-base, JieLi toolchain and AC79 SDK files
        env:
          PYTHON: /usr/bin/python3
          BOOTSTRAP_USB: 0               # mido / python-rtmidi only install over USB, not needed here
        run: sh scripts/bootstrap.sh

      - uses: actions/cache@v4
        id: emsdk
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          if [ "${{ steps.emsdk.outputs.cache-hit }}" != true ]; then
            git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
            "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
            "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
            rm -rf "$HOME/emsdk/downloads"
          fi
          . "$HOME/emsdk/emsdk_env.sh" >/dev/null 2>&1
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          emcc --version | head -1

      - name: Engine tests
        run: ./build.sh test

      - name: Layer host acceptance
        run: ./build.sh --host && tests/layer.sh

      - name: Screen reader audit
        run: |
          git clone --depth 1 https://github.com/charlesvestal/fm1-reader ../fm1-reader
          tools/sr_audit.sh

      - name: Pack file and the builder's ears (node)
        run: node tests/chpk.test.mjs && node tests/beats.test.mjs && node tests/fm1link.test.mjs && node tests/breakcut.test.mjs && node tests/mathcore.test.mjs

      - name: Firmware and emulator
        env:
          PYTHON: /usr/bin/python3
        run: |
          set -euo pipefail
          ./build.sh
          ./build.sh --web
          cp app/build/choppah.fwsc "app/build/choppah-main-${GITHUB_SHA::7}.fwsc"

      # The bleeding edge, for testing on a device before a release: the package of every push to main, kept 30 days
      # (Actions > the run > Artifacts). Not attested and not a release: releases stay tags (release.yml).
      - name: Firmware package (bleeding edge)
        uses: actions/upload-artifact@v4
        with:
          name: choppah-main-${{ github.sha }}
          path: app/build/choppah-main-*.fwsc
          if-no-files-found: error
          retention-days: 30

      # choppah.app/beta follows main: this run's package, once it has built and passed the tests above, sent with the
      # run's own GitHub OIDC token (no secret: choppah-hub's src/beta.js checks GitHub's signature, this repository,
      # main and this workflow). The version is the next minor's (1.6 -> "1.7-beta (sha7)"). A failure here
      # doesn't fail the build; the beta stays at the last one that arrived.
      - name: Beta on choppah.app
        continue-on-error: true
        run: |
          set -euo pipefail
          V="$(sh scripts/bump_version.sh minor)"
          T="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://choppah.app" | jq -r .value)"
          S="$(git log -1 --format=%s | tr -d '\n' | jq -sRr @uri)"
          C="$(curl -sS --retry 3 -o beta.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $T" -H "X-Hub: 1" \
                 -H "X-Beta-Version: $V" -H "X-Beta-Subject: $S" -H "Content-Type: application/octet-stream" \
                 --data-binary @app/build/choppah.fwsc https://choppah.app/api/beta)"
          cat beta.json; echo
          [ "$C" = 201 ] || { echo "::warning::the beta didn't go up on choppah.app (HTTP $C)"; exit 1; }

      # choppah.app/beta/emu/ follows main too: this run's browser emulator (app/build/emu above, in the site's look,
      # tools/site_style.py), file by file, then the list of them, which switches /beta/emu/ to this build (choppah-hub
      # src/beta.js, the same OIDC token check). The hub's packs go into it (PRD_PACKS PH-035, PH-036): the release's
      # /emu/ takes them from the next release on (fm1.toml emu = midi, port, data). A failure doesn't fail the build.
      - name: Beta emulator on choppah.app
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf build/beta_site && mkdir -p build/beta_site
          cp -r app/build/emu build/beta_site/emu
          /usr/bin/python3 -c 'import sys; sys.path.insert(0, "tools"); import site_style; from pathlib import Path; site_style.emu(Path("build/beta_site"))'
          V="$(sh scripts/bump_version.sh minor)"
          T="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://choppah.app" | jq -r .value)"
          S="$(git log -1 --format=%s | tr -d '\n' | jq -sRr @uri)"
          cd build/beta_site/emu
          find . -type f ! -path './o2/*' ! -path './web/*' ! -name '*.o' | sed 's|^\./||' | sort > ../files.txt
          while read -r f; do
            C="$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $T" -H "X-Hub: 1" \
                   -H "Content-Type: application/octet-stream" --data-binary @"$f" \
                   "https://choppah.app/api/beta/emu/file?path=$(printf %s "$f" | jq -sRr @uri)")"
            [ "$C" = 201 ] || { echo "::warning::the beta emulator's $f didn't go up on choppah.app (HTTP $C)"; exit 1; }
          done < ../files.txt
          C="$(jq -Rn '{files: [inputs]}' ../files.txt | curl -sS --retry 3 -o ../emu.json -w '%{http_code}' -X PUT \
                 -H "Authorization: Bearer $T" -H "X-Hub: 1" -H "X-Beta-Version: $V" -H "X-Beta-Subject: $S" \
                 -H "Content-Type: application/json" --data-binary @- https://choppah.app/api/beta/emu)"
          cat ../emu.json; echo
          [ "$C" = 201 ] || { echo "::warning::the beta emulator didn't switch on choppah.app (HTTP $C)"; exit 1; }
