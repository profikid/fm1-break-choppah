# Build CHOPPAH and publish its site (front page, web installer, browser emulator, manual, firmware download) to
# GitHub Pages. Every push (merge) to main is a release: one minor up from the last vX.Y tag, never below ./VERSION
# (scripts/next_version.sh), tagged and attached to a GitHub release. A re-run keeps its commit's version; a manual run
# of an unreleased commit builds X.Y-dev and releases nothing.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# one release at a time, in order: a run is never cancelled halfway through tagging
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        run: |
          TAGS="$(git ls-remote --tags origin 'v*')"
          # already released (a re-run of this commit): the same version again, never a second bump
          V="$(printf '%s\n' "$TAGS" | grep "^$GITHUB_SHA" | sed 's|.*refs/tags/v||; s|\^{}$||' \
               | grep -E '^[0-9]+\.[0-9]+$' | head -1)"
          if [ -z "$V" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            V="$(sh scripts/next_version.sh)"            # this merge's release
          elif [ -z "$V" ]; then
            V="$(sh scripts/next_version.sh)-dev"        # a manual rebuild of unreleased code: not a release
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "CHOPPAH $V" >> "$GITHUB_STEP_SUMMARY"

      # Pillow's wheel carries raqm (the fonts' layout), which needs only libfribidi from the system: a pip
      # install in place of apt-get update + install. apt is the fallback if the runner image lacks libfribidi.
      - name: Pillow with raqm (the build's fonts)
        run: |
          raqm() { /usr/bin/python3 -c 'from PIL import features; raise SystemExit(not features.check("raqm"))' 2>/dev/null; }
          raqm || /usr/bin/python3 -m pip install -q --user --break-system-packages Pillow
          raqm || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }
          raqm && /usr/bin/python3 -c 'import PIL; print("Pillow", PIL.__version__, "with raqm")'

      # JieLi's toolchain (pkgman.jieliapp.com) and the SDK files (gitee) are pinned in bootstrap.sh: cached until
      # bootstrap.sh changes, which also spares the build those two slow, now-and-then flaky servers
      - uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}

      - name: fm1-base, JieLi toolchain and AC79 SDK files
        env:
          PYTHON: /usr/bin/python3
          BOOTSTRAP_USB: 0               # mido / python-rtmidi only install over USB, not needed here
        run: sh scripts/bootstrap.sh

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Engine tests
        run: ./build.sh test

      - name: Firmware, emulator and site
        env:
          PYTHON: /usr/bin/python3
        run: |
          rm -f app/bank_data.h        # public builds never carry recorded breaks
          ./build.sh --release "$VERSION"
          ./build.sh --web
          /usr/bin/python3 base/tools/make_site.py app "app/build/choppah-$VERSION.fwsc" "$VERSION" site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Release
        if: github.ref == 'refs/heads/main' && !endsWith(env.VERSION, '-dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: CHOPPAH ${{ env.VERSION }}
          generate_release_notes: true
          make_latest: true
          files: app/build/choppah-${{ env.VERSION }}.fwsc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
