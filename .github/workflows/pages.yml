# SPDX-License-Identifier: MPL-2.0
# CHOPPAH's site: the front page, the web installer, the browser emulator, the manual and the firmware download.
#
# The site is built from the release's own package, the one the shared builder attested, so the site and the Firmware
# Hub serve the same bytes. The package is not built here: a package built here would not be the attested one.
#
# Called by .github/workflows/release.yml with the version of the release. Run by hand (workflow_dispatch) it rebuilds
# the site of a release that is already published.
name: Build and publish the site

on:
  workflow_call:
    inputs:
      version:
        description: 'the version of the release the site is built for (X.Y)'
        required: true
        type: string
      package-from:
        description: 'where the package comes from: the attested artifact of this run, or the published release'
        required: false
        default: artifact
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'the version of the release the site is built for (X.Y)'
        required: true
        type: string
      package-from:
        description: 'where the package comes from: the attested artifact of this run, or the published release'
        required: false
        default: release
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# one release at a time, in order: a run is never cancelled halfway through the deploy
concurrency:
  group: pages
  cancel-in-progress: false

env:
  EMSDK_VERSION: 3.1.74

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: The attested package
        if: inputs.package-from == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested

      - name: The attested package (from the published release)
        if: inputs.package-from != 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build/package
          gh release download "v$VERSION" --pattern "choppah-$VERSION.fwsc" --dir build/package --clobber

      - name: The package in one place
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p app/build
          # the attested package of this release, not a build here
          for src in build/attested/build/release-assets/choppah-"$VERSION".fwsc \
                     build/package/choppah-"$VERSION".fwsc; do
            if [ -f "$src" ]; then cp "$src" app/build/; echo "package: $src"; exit 0; fi
          done
          echo "no choppah-$VERSION.fwsc in the artifact or the release" >&2
          exit 1

      - name: Pillow with raqm (the build's fonts)
        run: |
          raqm() { /usr/bin/python3 -c 'from PIL import features; raise SystemExit(not features.check("raqm"))' 2>/dev/null; }
          raqm || /usr/bin/python3 -m pip install -q --user --break-system-packages Pillow
          raqm || { sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0; }
          raqm && /usr/bin/python3 -c 'import PIL; print("Pillow", PIL.__version__, "with raqm")'

      # Emscripten for the browser emulator. setup-emsdk@v14's own cache uses GitHub's retired cache service (400)
      # and its install spends ~20 s unpacking .tar.xz, so emsdk is installed by hand and kept with actions/cache.
      - uses: actions/cache@v4
        id: emsdk
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          if [ "${{ steps.emsdk.outputs.cache-hit }}" != true ]; then
            git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
            "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
            "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
            rm -rf "$HOME/emsdk/downloads"           # the archives: not worth caching
          fi
          . "$HOME/emsdk/emsdk_env.sh" >/dev/null 2>&1   # PATH, EMSDK, EMSDK_NODE: kept for the later steps
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          emcc --version | head -1

      - name: The emulator and the site
        env:
          PYTHON: /usr/bin/python3
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # the emulator: the same source, in the browser
          ./build.sh --web --release "$VERSION"
          /usr/bin/python3 base/tools/make_site.py app "app/build/choppah-$VERSION.fwsc" "$VERSION" site
          /usr/bin/python3 tools/site_style.py site    # CHOPPAH's look, and the control map in the manual
          /usr/bin/python3 tools/site_latest.py site   # a stable name for the package, so a catalogue's link keeps working

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
