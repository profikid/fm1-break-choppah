# CHOPPAH's build settings (fm1-base's tools/build.py: ./build.sh)
name = "CHOPPAH"               # the build's files: choppah.fwsc, choppah-X.Y.fwsc
id_prefix = "FM-1_86"          # package identity: dev FM-1_8600, releases FM-1_86XXYYZZ (PRD Q5: check it is free)
usb_manufacturer = "CHOPPAH"
usb_product = "CHOPPAH FM-1"
ble = true                     # Bluetooth MIDI (PRD A-71): on and off on the GLOBAL page
ble_stack = "own"              # fm1-base's own stack: nothing of JieLi's, ~40 KB
bt_audio = true                # Bluetooth audio out (A2DP source to headphones and speakers, PRD A-72): GLOBAL
usb_audio_in = true            # the FM-1 recordable over USB (PRD A-50)
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/*.c"]               # the engine, at -O2
unity_opt = "z"                # the platform and the UI at -Oz (the engine stays -O2): smaller
boot_pack = true               # the start-up's RAM images stored LZMA-packed: smaller
# the site (tools/make_site.py)
install_app = "site/install_app.js"   # confetti when the install is done
tagline = "An Amen chopper for the FM-1"
repo = "https://github.com/profikid/fm1-break-choppah"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
# firmware.json (for the firmware hubs: the Firmware Hub, RemoteFM1, M-Flasher)
author = "Laurens Profittlich"
description = "CHOPPAH turns the M-VAVE FM-1 into an Amen break chopper. Eight classic Amen-family breaks are cut into sixteen slices on the white keys; hold a key to loop it. The black keys are momentary pads for rolls, reverse, freeze, tape stop, gate, filter and dub throws. A live generator rearranges the break, and a four-slot FX chain and a DJ filter sit behind it. Bluetooth audio sends the whole mix to a speaker or headphones."
tags = ["drum-machine", "sampler"]
install = "https://profikid.github.io/fm1-break-choppah/install/"
site = "https://profikid.github.io/fm1-break-choppah/"
screenshot = "docs/img/card.png"
