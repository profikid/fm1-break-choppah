# CHOPPAH's build settings (fm1-base's tools/build.py: ./build.sh)
name = "CHOPPAH"               # the build's files: choppah.fwsc, choppah-X.Y.fwsc
id_prefix = "FM-1_86"          # package identity: dev FM-1_8600, releases FM-1_86XXYYZZ (PRD Q5: check it is free)
usb_manufacturer = "CHOPPAH"
usb_product = "CHOPPAH FM-1"
ble = true                     # Bluetooth MIDI (PRD A-71): on and off on the GLOBAL page
ble_stack = "own"              # fm1-base's own stack: nothing of JieLi's, ~40 KB
usb_audio_in = true            # the FM-1 recordable over USB (PRD A-50)
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/*.c"]               # the engine, at -O2
# the site (tools/make_site.py)
tagline = "An Amen chopper for the FM-1"
repo = "https://github.com/profikid/fm1-break-choppah"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
